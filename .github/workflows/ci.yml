name: Integracion Continua (CI)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    # Levanta un contenedor de PostgreSQL en la máquina virtual de GitHub
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: url_shortener_test
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Instalar dependencias
        run: npm install

      - name: Inicializar tablas en PostgreSQL
        run: npm run db:init

      - name: Ejecutar pruebas unitarias
        run: npm test -- --runInBand
